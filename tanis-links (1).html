  <title id="page-title"></title>
  <link rel="icon" id="page-favicon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    :root {
      --a: #ff0033;
      --ag: rgba(255, 0, 51, 0.7);
      --ad: rgba(255, 0, 51, 0.1);
      --ab: rgba(255, 0, 51, 0.35);
      --bg0: #030407;
      --bg1: #07080f;
      --brd: rgba(255, 255, 255, 0.05);
      --brda: rgba(255, 0, 51, 0.28);
      --txt: #e8e8f0;
      --txm: #8888aa;
      --txd: #8888aa;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg0);
      color: var(--txt);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg0); }
    ::-webkit-scrollbar-thumb { background: var(--a); border-radius: 2px; }
    ::selection { background: var(--a); color: #fff; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(ellipse 90% 50% at 50% 0%, var(--ad) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 80%, var(--ad) 0%, transparent 50%);
      z-index: 0; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255, 0, 51, 0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 51, 0.015) 1px, transparent 1px);
      background-size: 55px 55px; z-index: 0; pointer-events: none;
    }
    .wrap { width: 100%; max-width: 430px; margin: 0 auto; position: relative; z-index: 2; }

    @keyframes cardLineIntro { 0%, 70% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes logoIntro { 0% { transform: scale(1.5) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes pulseUsername {
      0% { transform: scale(1); text-shadow: 0 0 10px rgba(255,0,51,0.5); }
      50% { transform: scale(1.05); text-shadow: 0 0 20px rgba(255,0,51,0.9); }
      100% { transform: scale(1); text-shadow: 0 0 10px rgba(255,0,51,0.5); }
    }

    .profile-logo-wrap {
      width: 140px; height: 140px; border-radius: 50%; position: relative; margin-bottom: 15px;
      display: flex; align-items: center; justify-content: center; z-index: 10;
      animation: logoIntro 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .profile-logo-wrap::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--a), transparent 60%, var(--a));
      animation: spinRing 4s linear infinite; z-index: -1;
    }
    .profile-logo-wrap::after {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--a), transparent 60%, var(--a));
      animation: spinRing 4s linear infinite; filter: blur(10px); z-index: -2; opacity: 0.5;
    }
    @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .profile-logo-img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 4px solid rgba(10, 10, 15, 0.9); position: relative; z-index: 2;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .anim-fade-up { opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .delay-1 { animation-delay: 0.2s; } .delay-2 { animation-delay: 0.3s; } .delay-3 { animation-delay: 0.4s; }
    .delay-4 { animation-delay: 0.5s; } .delay-5 { animation-delay: 0.6s; } .delay-6 { animation-delay: 0.7s; }
    .delay-7 { animation-delay: 0.8s; } .delay-8 { animation-delay: 0.9s; } .delay-9 { animation-delay: 1.0s; }

    @keyframes cardIntro { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .profile-card {
      background: rgba(15, 15, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 0 30px rgba(255,255,255,0.03);
      backdrop-filter: blur(20px) saturate(150%);
      animation: cardIntro 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      border-radius: 32px; position: relative; overflow: hidden;
    }
    .profile-card::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: skewX(-25deg); animation: shineCard 6s infinite; z-index: 1; pointer-events: none;
    }
    @keyframes shineCard { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

    .hero-sub { font-size: 1.05rem; color: var(--txm); margin-bottom: 40px; }

    .social-btn {
      display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative; overflow: hidden; z-index: 2; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .social-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%); transition: transform 0.6s ease; z-index: -1;
    }
    .social-btn:hover { transform: translateY(-6px) scale(1.04); background: rgba(255, 255, 255, 0.06); }
    .social-btn:hover::before { transform: translateX(100%); }

    .icon-box {
      width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: rgba(0, 0, 0, 0.4); box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden;
    }
    .icon-box img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 16px; }

    .platform-name {
      font-family: 'Orbitron', monospace; font-size: 1.05rem; font-weight: 900;
      color: rgba(255, 255, 255, 0.85); flex: 1; text-align: left; padding-left: 18px;
      letter-spacing: 1.5px; transition: all 0.3s;
    }
    .platform-name small {
      display: block; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 1px; color: var(--txm); margin-top: 3px;
    }
    .go-icon { font-size: 20px; color: rgba(255, 255, 255, 0.3); padding-right: 12px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .social-btn:hover .go-icon { transform: translateX(6px) scale(1.2); color: #fff; }
    .social-btn:hover .icon-box { transform: scale(1.1); }

    /* Brand Customizations */
    .tiktok:hover { border-color: rgba(0, 242, 254, 0.6); box-shadow: 0 15px 30px rgba(0, 242, 254,0.25), inset 0 0 15px rgba(0, 242, 254,0.1); }
    .tiktok:hover .icon-box { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; box-shadow: 0 0 20px rgba(0, 242, 254,0.6); }
    .tiktok:hover .platform-name { color: #00f2fe; text-shadow: 0 0 15px rgba(0, 242, 254,0.5); }
    .tiktok .icon-box { color: rgba(255, 255, 255, 0.8); text-shadow: 2px 2px 0px rgba(254, 9, 121, 0.8); }

    .whatsapp:hover { border-color: rgba(37, 211, 102, 0.6); box-shadow: 0 15px 30px rgba(37, 211, 102,0.25), inset 0 0 15px rgba(37, 211, 102,0.1); }
    .whatsapp:hover .icon-box { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; box-shadow: 0 0 20px rgba(37, 211, 102,0.6); }
    .whatsapp:hover .platform-name { color: #25D366; text-shadow: 0 0 15px rgba(37, 211, 102,0.5); }
    .whatsapp .icon-box { color: rgba(37, 211, 102, 0.8); }

    .telegram:hover { border-color: rgba(0, 136, 204, 0.6); box-shadow: 0 15px 30px rgba(0, 136, 204,0.25), inset 0 0 15px rgba(0, 136, 204,0.1); }
    .telegram:hover .icon-box { background: linear-gradient(135deg, #0088cc, #005580); color: #fff; box-shadow: 0 0 20px rgba(0, 136, 204,0.6); }
    .telegram:hover .platform-name { color: #0088cc; text-shadow: 0 0 15px rgba(0, 136, 204,0.5); }
    .telegram .icon-box { color: rgba(0, 136, 204, 0.8); }

    /* Personal Contact */
    .contact:hover { border-color: rgba(255, 193, 7, 0.6); box-shadow: 0 15px 30px rgba(255, 193, 7,0.25), inset 0 0 15px rgba(255, 193, 7,0.1); }
    .contact:hover .icon-box { background: linear-gradient(135deg, #ffc107, #ff8f00); color: #fff; box-shadow: 0 0 20px rgba(255, 193, 7,0.6); }
    .contact:hover .platform-name { color: #ffc107; text-shadow: 0 0 15px rgba(255, 193, 7,0.5); }
    .contact .icon-box { color: rgba(255, 193, 7, 0.85); }

    /* bKash */
    .bkash:hover { border-color: rgba(226, 19, 110, 0.6); box-shadow: 0 15px 30px rgba(226, 19, 110,0.25), inset 0 0 15px rgba(226, 19, 110,0.1); }
    .bkash:hover .icon-box { background: linear-gradient(135deg, #e2136e, #a00c4e); color: #fff; box-shadow: 0 0 20px rgba(226, 19, 110,0.6); }
    .bkash:hover .platform-name { color: #e2136e; text-shadow: 0 0 15px rgba(226, 19, 110,0.5); }
    .bkash .icon-box { color: rgba(226, 19, 110, 0.9); }

    /* imo */
    .imo:hover { border-color: rgba(30, 100, 200, 0.7); box-shadow: 0 15px 30px rgba(30, 100, 200,0.25), inset 0 0 15px rgba(30, 100, 200,0.1); }
    .imo:hover .icon-box { background: linear-gradient(135deg, #2f6fd0, #1a4590); color: #fff; box-shadow: 0 0 20px rgba(30, 100, 200,0.6); }
    .imo:hover .platform-name { color: #4a8be8; text-shadow: 0 0 15px rgba(30, 100, 200,0.5); }
    .imo .icon-box { color: rgba(74, 139, 232, 0.9); }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: 100%; max-width: 340px; background: rgba(18,18,26,0.97); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 26px; padding: 26px 22px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .modal h3 { font-family: 'Orbitron', monospace; font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 6px; }
    .modal .num { font-family: 'Share Tech Mono', monospace; font-size: 1.35rem; letter-spacing: 2px; margin: 10px 0 16px; }
    .modal img.qr { width: 100%; max-width: 230px; border-radius: 14px; background: #fff; padding: 6px; margin-bottom: 16px; }
    .modal .row { display: flex; gap: 10px; }
    .mbtn {
      flex: 1; padding: 12px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 1rem; cursor: pointer; transition: all .25s; display: block; text-align: center;
    }
    .mbtn:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
    .mbtn.main { border: none; color: #fff; }
    .modal .close { margin-top: 12px; color: var(--txm); font-size: 0.95rem; cursor: pointer; }

    .toast {
      position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 30px);
      background: rgba(20, 20, 28, 0.95); color: #fff; border: 1px solid var(--brda);
      padding: 12px 22px; border-radius: 14px; font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem; letter-spacing: 1px; opacity: 0; pointer-events: none;
      transition: all 0.35s ease; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .footer {
      text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 0.55rem;
      color: var(--txd); margin-top: 40px; padding-bottom: 10px; letter-spacing: 3px; opacity: 0.5;
    }
    .footer span { color: var(--a); }
  </style>
</head>

<body>
  <div class="wrap" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding: 30px 0;">

    <div class="card profile-card" style="width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 50px 30px;">

      <div class="profile-logo-wrap">
        <img id="display-profile-pic" src="" alt="Profile" class="profile-logo-img">
      </div>

      <div class="anim-fade-up delay-1" style="margin-top: 10px; margin-bottom: 8px;">
        <p id="display-username" style="color: var(--a); font-family: 'Share Tech Mono', monospace; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 15px rgba(255,0,51,0.6); letter-spacing: 1.5px; animation: pulseUsername 2s infinite alternate;">@tanis</p>
      </div>
      <p class="hero-sub anim-fade-up delay-2" style="margin-top: 0px; margin-bottom: 35px; font-size: 1.1rem;">Welcome to my official links</p>

      <div style="display: flex; flex-direction: column; gap: 18px; width: 100%;">

        <!-- Personal Contact (আগে YouTube ছিল) -->
        <a id="btn-contact" class="social-btn contact anim-fade-up delay-3">
          <div class="icon-box" id="contact-icon"><i class="ti ti-phone-call"></i></div>
          <span class="platform-name">Contact<small id="contact-num"></small></span>
          <i class="ti ti-chevron-right go-icon"></i>
        </a>

        <!-- TikTok -->
        <a id="btn-tt" href="https://www.tiktok.com/@your_tanis_1" class="social-btn tiktok anim-fade-up delay-4">
          <div class="icon-box" id="tiktok-icon"><i class="ti ti-brand-tiktok"></i></div>
          <span class="platform-name">TikTok</span>
          <i class="ti ti-chevron-right go-icon"></i>
        </a>

        <!-- bKash (আগে Facebook ছিল) -->
        <a id="btn-bkash" class="social-btn bkash anim-fade-up delay-5">
          <div class="icon-box" id="bkash-icon"><i class="ti ti-wallet"></i></div>
          <span class="platform-name">bKash<small id="bkash-num"></small></span>
          <i class="ti ti-qrcode go-icon" id="bkash-qr-btn" title="QR"></i>
        </a>

        <!-- imo (আগে Instagram ছিল) -->
        <a id="btn-imo" class="social-btn imo anim-fade-up delay-6">
          <div class="icon-box" id="imo-icon"><i class="ti ti-message-circle-2"></i></div>
          <span class="platform-name">imo<small id="imo-num"></small></span>
          <i class="ti ti-qrcode go-icon" id="imo-qr-btn" title="QR"></i>
        </a>

        <!-- WhatsApp -->
        <a id="btn-wa" class="social-btn whatsapp anim-fade-up delay-7">
          <div class="icon-box" id="wa-icon"><i class="ti ti-brand-whatsapp"></i></div>
          <span class="platform-name">WhatsApp</span>
          <i class="ti ti-chevron-right go-icon"></i>
        </a>

        <!-- Telegram -->
        <a id="btn-tg" href="https://t.me/TRADER_TANIS01" class="social-btn telegram anim-fade-up delay-8">
          <div class="icon-box" id="tg-icon"><i class="ti ti-brand-telegram"></i></div>
          <span class="platform-name">Telegram</span>
          <i class="ti ti-chevron-right go-icon"></i>
        </a>

      </div>
    </div>
    <p class="footer anim-fade-up delay-9">© 2026 <span id="display-fullname">TANIS</span> · ALL RIGHTS RESERVED</p>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h3 id="m-title"></h3>
      <div class="num" id="m-num"></div>
      <img class="qr" id="m-qr" alt="QR" style="display:none">
      <div class="row">
        <button class="mbtn" id="m-copy">Copy</button>
        <a class="mbtn main" id="m-open">Open App</a>
      </div>
      <div class="close" id="m-close">Close</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.getElementById('page-title').textContent = config_fullname.toUpperCase() + " | Bio Links";
    document.getElementById('display-username').textContent = config_username.toLowerCase();
    document.getElementById('display-fullname').textContent = config_fullname.toUpperCase();
    document.getElementById('display-profile-pic').src = config_profile_pic;

    // নম্বর ও লিংক বসানো
    document.getElementById('contact-num').textContent = personal_number;
    document.getElementById('bkash-num').textContent = bkash_number;
    document.getElementById('imo-num').textContent = imo_number;
    document.getElementById('btn-contact').href = "tel:+88" + personal_number;
    document.getElementById('btn-wa').href = "https://wa.me/" + whatsapp_number;

    // লোগো বসানো (ছবি না পেলে আইকন থেকে যাবে)
    function setLogo(id, url) {
      if (!url) return;
      const box = document.getElementById(id);
      const old = box.innerHTML;
      const img = new Image();
      img.alt = "";
      img.onload = () => { box.innerHTML = ""; box.appendChild(img); };
      img.onerror = () => { box.innerHTML = old; };
      img.src = url;
    }
    setLogo('contact-icon', contact_logo_url);
    setLogo('tiktok-icon', tiktok_logo_url);
    setLogo('bkash-icon', bkash_logo_url);
    setLogo('imo-icon', imo_logo_url);
    setLogo('wa-icon', whatsapp_logo_url);
    setLogo('tg-icon', telegram_logo_url);

    // কপি + টোস্ট
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    function copyText(text, label) {
      const done = () => showToast(label + " copied: " + text);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallback());
      } else { fallback(); }
      function fallback() {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    }
    // bKash / imo পপআপ
    const bg = document.getElementById('modal-bg');
    const mQr = document.getElementById('m-qr');
    function openModal(title, number, qrUrl, appLink, color) {
      document.getElementById('m-title').textContent = title;
      document.getElementById('m-num').textContent = number;
      document.getElementById('m-open').href = appLink;
      document.getElementById('m-open').style.background = color;
      document.getElementById('m-copy').onclick = () => copyText(number, title);
      mQr.style.display = 'none';
      if (qrUrl) { mQr.onload = () => mQr.style.display = 'inline-block'; mQr.onerror = () => mQr.style.display = 'none'; mQr.src = qrUrl; }
      bg.classList.add('show');
    }
    const bkashQR = () => openModal('bKash', bkash_number, bkash_qr_url,
        'intent://#Intent;package=com.bKash.customerapp;end', 'linear-gradient(135deg,#e2136e,#a00c4e)');
    const imoQR = () => openModal('imo', imo_number, imo_qr_url,
        'intent://#Intent;package=com.imo.android.imoim;end', 'linear-gradient(135deg,#2f6fd0,#1a4590)');

    // ---- অ্যাপ সরাসরি খোলা ----
    const UA = navigator.userAgent || "";
    const isAndroid = /Android/i.test(UA);
    const isIOS = /iPhone|iPad|iPod/i.test(UA);
    const enc = encodeURIComponent;

    // Android: intent লিংক (অ্যাপ থাকলে অ্যাপ, না থাকলে fallback)
    function androidIntent(path, scheme, pkg, fallback) {
      return 'intent://' + path + '#Intent;scheme=' + scheme + ';package=' + pkg +
             ';S.browser_fallback_url=' + enc(fallback) + ';end';
    }
    // iOS: অ্যাপের স্কিম, না খুললে fallback
    function iosOpen(scheme, fallback) {
      const t = Date.now();
      window.location.href = scheme;
      setTimeout(() => {
        if (!document.hidden && Date.now() - t < 2500) window.location.href = fallback;
      }, 1200);
    }
    function openApp(o) {
      if (isAndroid && o.android) { window.location.href = o.android; return; }
      if (isIOS && o.ios) { iosOpen(o.ios, o.web); return; }
      window.open(o.web, '_blank');
    }

    const wa_web = 'https://wa.me/' + whatsapp_number;
    const tg_web = 'https://t.me/TRADER_TANIS01';
    const tt_web = 'https://www.tiktok.com/@your_tanis_1';
    const play = 'https://play.google.com/store/apps/details?id=';

    const APPS = {
      'btn-wa': {
        web: wa_web,
        android: androidIntent('send?phone=' + whatsapp_number, 'whatsapp', 'com.whatsapp', wa_web),
        ios: 'whatsapp://send?phone=' + whatsapp_number
      },
      'btn-tg': {
        web: tg_web,
        android: androidIntent('resolve?domain=TRADER_TANIS01', 'tg', 'org.telegram.messenger', tg_web),
        ios: 'tg://resolve?domain=TRADER_TANIS01'
      },
      'btn-tt': {
        web: tt_web,
        android: androidIntent('www.tiktok.com/@your_tanis_1', 'https', 'com.zhiliaoapp.musically', tt_web),
        ios: 'snssdk1233://user/profile/?username=your_tanis_1'
      },
      'btn-bkash': {
        web: play + 'com.bKash.customerapp',
        android: 'intent://#Intent;package=com.bKash.customerapp;S.browser_fallback_url=' + enc(play + 'com.bKash.customerapp') + ';end',
        ios: 'bKash://',
        copy: ['bKash', bkash_number]
      },
      'btn-imo': {
        web: play + 'com.imo.android.imoim',
        android: 'intent://#Intent;package=com.imo.android.imoim;S.browser_fallback_url=' + enc(play + 'com.imo.android.imoim') + ';end',
        ios: 'imo://',
        copy: ['imo', imo_number]
      }
    };
    Object.keys(APPS).forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        e.preventDefault();
        const o = APPS[id];
        if (o.copy) copyText(o.copy[1], o.copy[0]);   // নম্বর কপি হয়ে যাবে, অ্যাপে পেস্ট করো
        openApp(o);
      });
    });
    // Contact: সরাসরি ডায়ালার
    document.getElementById('btn-contact').addEventListener('click', e => {
      e.preventDefault();
      window.location.href = 'tel:+88' + personal_number;
    });
    // QR বোতাম (শুধু পপআপ, অ্যাপ খুলবে না)
    document.getElementById('bkash-qr-btn').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); bkashQR(); });
    document.getElementById('imo-qr-btn').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); imoQR(); });
    document.getElementById('m-close').addEventListener('click', () => bg.classList.remove('show'));
    bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });

    // Favicon গোল করা
    const faviconImg = new Image();
    faviconImg.crossOrigin = "Anonymous";
    faviconImg.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.beginPath(); ctx.arc(128, 128, 128, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(faviconImg, 0, 0, faviconImg.width, faviconImg.height, 0, 0, 256, 256);
      try { document.getElementById('page-favicon').href = canvas.toDataURL(); }
      catch (e) { document.getElementById('page-favicon').href = config_profile_pic; }
    };
    faviconImg.onerror = () => document.getElementById('page-favicon').href = config_profile_pic;
    faviconImg.src = config_profile_pic;
  </script>
</body>
</html>
